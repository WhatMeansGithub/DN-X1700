; Black Pill (STM32F411CE) that impersonates the DN-X1700's USB descriptors, to test what macOS accepts.
; Full-speed only (F411 has no HS port): this answers "does macOS still say missingAssociation?", not "does audio work".
; Flash: hold BOOT0, tap NRST, release BOOT0 (DFU mode), then `pio run -t upload`.
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = libopencm3
upload_protocol = dfu
build_flags = -Os
