name: filter-menu
description: >
  Filter Control. Utility > Parameters Filter Setting gets four more rows: LPF Reso and HPF Reso (0..100 %), HPF Gate
  (Off, 100..1000 Hz) and HPF Range (Stock, 20-150 .. 20-2500). Stored in settings bytes 92..95 (unused by Denon,
  saved with the settings and in Preset Export/Import). A small program in unused flash is copied to RAM at start-up
  (normal mode only) and writes the damping table and the HPF cutoff coefficients into the DSP when a setting changes.
  Nothing in Denon's DSP package is patched. Generated and emulator-checked by tools/gen_filter_menu.py.
  Details: docs/filter-control.md.
status: tested by one owner on one unit
patches:
  - offset: 0xd3a00
    expect: ""
    new: ""
    reason: "Start-up hook (normal mode only): waits for the DSP's own initialisation, copies the resident program to RAM, redirects nine pointers and starts the filter. Runs in place of the 4-byte pointer patched below; in Version UP Mode and the service modes it does nothing."
  - offset: 0xd4000
    expect: ""
    new: ""
    reason: "The resident program: filter menu (4 rows), settings storage logic, the damping-table builder, the HPF range tables and the DSP writes. Unused flash after the end of the application; copied to RAM at start-up."
  - offset: 0x16c00
    expect: "0c000c04"
    new: "000d3a00"
    reason: "Pointer to the start-up hook (Denon's code calls this slot after the DSP firmware has been loaded; the original pointer was 0x0C000C04, which the hook calls first)."
